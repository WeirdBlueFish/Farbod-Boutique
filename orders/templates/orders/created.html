{% extends 'store/base.html' %}

{% block title %}سفارش ثبت شد{% endblock %}

{% block content %}
<div class="text-center mt-5">
    <div style="font-size: 80px;">🎉</div>
    <h1 class="text-success display-4 fw-bold mt-3">سفارش شما ثبت شد!</h1>
    
    <div class="card shadow-sm border-0 d-inline-block mt-4 p-4 bg-light">
        <p class="lead mb-1">کد پیگیری سفارش شما:</p>
        <h2 class="fw-bold text-dark">#{{ order.id }}</h2>
        <p class="text-muted mt-3">همکاران ما جهت هماهنگی ارسال با شما تماس خواهند گرفت.</p>
    </div>

    <div class="mt-5">
        <a href="/" class="btn btn-outline-dark btn-lg">بازگشت به خانه 🏠</a>
    </div>
</div>
{% endblock %}
